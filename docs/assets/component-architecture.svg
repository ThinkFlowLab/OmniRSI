<text x="84" y="295" font-size="21" font-weight="400" fill="#172B42" text-anchor="start">Codex / 三方 Agent</text>
<text x="84" y="326" font-size="20" font-weight="400" fill="#172B42" text-anchor="start">角色、假设、候选补丁与交接</text>
<rect x="450" y="215" width="540" height="130" rx="16" fill="#F0F6FF" stroke="#2864D9" stroke-width="2"/>
