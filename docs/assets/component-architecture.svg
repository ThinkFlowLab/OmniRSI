<text x="474" y="295" font-size="21" font-weight="400" fill="#172B42" text-anchor="start">Phase 0–5 / 状态迁移 / 调度与恢复</text>
<text x="474" y="326" font-size="21" font-weight="400" fill="#172B42" text-anchor="start">任务、预算、停止与候选裁决</text>
