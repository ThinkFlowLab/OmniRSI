<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="component-title component-desc">
<title id="component-title">OmniRSI 组件结构：CLI args、公共控制核心、多仓库与多加速器适配</title>
<desc id="component-desc">用户通过 CLI args 提供配置。Controller 管理状态和预算，Agent 产生候选，TargetAdapter 与 PlatformAdapter 提供仓库和设备计划，Runner 执行，Evaluator 判断证据，Knowledge、Storage、Reporting 和 Skill Hub 保存并复用结果。</desc>
<defs>
<marker id="component-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2864D9"/></marker>
<marker id="component-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#168168"/></marker>
</defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1440" height="1140" fill="#FFFFFF"/>
